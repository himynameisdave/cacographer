name: Dependabot Shepherd

on:
  schedule:
    - cron: '10 16 * * *' # Daily at 08:10 PST (UTC-8).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read

jobs:
  shepherd:
    uses: himynameisdave/depbot-shepherd/.github/workflows/shepherd.yml@main
    with:
      dry-run: false
      model: gpt-6-luna
      reasoning-effort: medium
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
